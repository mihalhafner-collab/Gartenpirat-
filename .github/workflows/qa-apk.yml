name: Haus & Garten unsigned update candidate (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  existing-app-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout selected combined source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python3 -m pip install -r requirements-mcp.txt reportlab Pillow
      - name: Set up existing browser test tools
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing browser test tools outside the source tree
        run: |
          npm install --prefix "$RUNNER_TEMP/hg-browser-tools" --no-save playwright@1.64.1 acorn@8.19.0
          "$RUNNER_TEMP/hg-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
          echo "HG_PLAYWRIGHT_MODULE=$RUNNER_TEMP/hg-browser-tools/node_modules/playwright" >> "$GITHUB_ENV"
          echo "HG_ACORN_MODULE=$RUNNER_TEMP/hg-browser-tools/node_modules/acorn" >> "$GITHUB_ENV"
      - name: Verify single plant source and generated Web assets
        run: python3 tools/sync_plant_assets.py
      - name: Run synthetic data and camera host regressions
        run: |
          mkdir -p outputs
          python3 tests/run_quality_suite.py --exclude-qa-signing
          python3 tests/run_photo_capture_tests.py
          node --check android/app/src/main/assets/workday-ui.js
          node tests/camera-timer-static.test.cjs
      - name: Run synthetic browser regressions
        env:
          HG_TEST_LOCAL_ASSETS: '1'
        run: python3 tests/run_browser_regressions.py
      - name: Locate preinstalled Android SDK tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Accept Android SDK licenses
        run: |
          python3 - <<'PY'
          import os, subprocess
          result = subprocess.run([os.environ['SDKMANAGER'], '--licenses'], input='y\n' * 100, text=True)
          raise SystemExit(result.returncode)
          PY
      - name: Install Android 17 build packages
        run: '"$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"'
      - name: Run Java sync and owner contract regressions
        run: |
          mkdir -p .dependencies/pixel-tunnel-tests
          curl -fsSL https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o .dependencies/pixel-tunnel-tests/json-20240303.jar
          echo "3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  .dependencies/pixel-tunnel-tests/json-20240303.jar" | sha256sum -c -
          python3 tools/run-followup-java.py
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true
      - name: Build original package without a replacement signing key
        working-directory: android
        run: gradle --no-daemon --no-configuration-cache --no-build-cache :app:assembleRelease
      - name: Check final APK privacy and packaged operative assets
        run: |
          python3 tests/apk_privacy_guard.py --apk android/app/build/outputs/apk/release/app-release-unsigned.apk
          python3 tests/verify_app_candidate.py \
            --apk android/app/build/outputs/apk/release/app-release-unsigned.apk \
            --aapt "$SDK_ROOT/build-tools/37.0.0/aapt" \
            --apksigner "$SDK_ROOT/build-tools/37.0.0/apksigner" \
            --report outputs/operative-candidate.json
      - name: Upload unsigned review candidate (not approved for installation)
        uses: actions/upload-artifact@v4
        with:
          name: Haus-Garten-UNSIGNED-NOT-RELEASED
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            outputs/operative-candidate.json
          if-no-files-found: error
          retention-days: 7
