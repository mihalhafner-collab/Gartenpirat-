name: Gartenpirat source and native backup checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'struktur-neu/android/**'
      - 'struktur-neu/tests/**'
      - 'struktur-neu/tools/**'
      - '.github/workflows/qa-apk.yml'

permissions:
  contents: read

jobs:
  current-source-and-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: struktur-neu
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true
      - name: Check current source and synthetic fixtures
        run: python3 -B tools/check_current.py
      - name: Install Android build and isolated emulator packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          python3 - "$SDKMANAGER" <<'PY'
          import subprocess,sys
          subprocess.run([sys.argv[1], '--licenses'], input='y\n'*100, text=True, check=True)
          PY
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools' 'emulator' 'system-images;android-35;default;x86_64'
      - name: Build production sources and native test APK without release signing
        working-directory: struktur-neu/android
        run: gradle --no-daemon --no-configuration-cache --no-build-cache :app:assembleRelease :app:assembleReleaseAndroidTest
      - name: Run JVM archive, warning, rollback and related regressions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gp-deps"
          curl -fsSL https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o "$RUNNER_TEMP/gp-deps/json.jar"
          HG_JSON_JAR="$RUNNER_TEMP/gp-deps/json.jar" python3 -B tools/run-followup-java.py
      - name: Sign disposable emulator test packages only
        run: |
          set -euo pipefail
          # This temporary test key is never used for a user APK and no APK is published.
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/gp-test.jks" -storepass android -keypass android -alias qa -keyalg RSA -validity 2 -dname 'CN=Gartenpirat Synthetic Emulator Only'
          SIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          ALIGN="$ANDROID_HOME/build-tools/37.0.0/zipalign"
          TEST_APK=$(find android/app/build/outputs/apk/androidTest/release -name '*.apk' -print -quit)
          test -n "$TEST_APK"
          "$ALIGN" -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/gp-app.apk"
          "$ALIGN" -f 4 "$TEST_APK" "$RUNNER_TEMP/gp-test.apk"
          "$SIGNER" sign --ks "$RUNNER_TEMP/gp-test.jks" --ks-pass pass:android --key-pass pass:android "$RUNNER_TEMP/gp-app.apk"
          "$SIGNER" sign --ks "$RUNNER_TEMP/gp-test.jks" --ks-pass pass:android --key-pass pass:android "$RUNNER_TEMP/gp-test.apk"
      - name: Run native SQLite save, restore and new-process readback
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n Gartenpirat_Backup_QA -k 'system-images;android-35;default;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd Gartenpirat_Backup_QA -port 5580 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" -s emulator-5580 wait-for-device
          for attempt in $(seq 1 120); do
            if [ "$("$ADB" -s emulator-5580 shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$("$ADB" -s emulator-5580 shell getprop ro.kernel.qemu | tr -d '\r')" = 1
          test "$("$ADB" -s emulator-5580 shell getprop sys.boot_completed | tr -d '\r')" = 1
          "$ADB" -s emulator-5580 install "$RUNNER_TEMP/gp-app.apk"
          "$ADB" -s emulator-5580 install "$RUNNER_TEMP/gp-test.apk"
          mkdir -p outputs
          for suite in local_backup local_backup_reopen; do
            "$ADB" -s emulator-5580 shell am force-stop at.hausgarten.service
            "$ADB" -s emulator-5580 shell am instrument -w -e suite "$suite" at.hausgarten.service.test/at.hausgarten.service.PixelMcpInstrumentation | tee "outputs/$suite.txt"
            python3 - "$suite" <<'PY'
          import pathlib,sys
          text=pathlib.Path('outputs/'+sys.argv[1]+'.txt').read_text()
          assert 'INSTRUMENTATION_CODE: -1' in text and '"native_backup_roundtrip":true' in text, text
          assert 'INSTRUMENTATION_FAILED' not in text and 'INSTRUMENTATION_RESULT: failure=' not in text, text
          PY
          done
      - name: Preserve synthetic test results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gartenpirat-backup-test-results
          path: |
            struktur-neu/outputs/local_backup*.txt
            struktur-neu/android/app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove disposable test signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/gp-test.jks" "$RUNNER_TEMP/gp-app.apk" "$RUNNER_TEMP/gp-test.apk"
