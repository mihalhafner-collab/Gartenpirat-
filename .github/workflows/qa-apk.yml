name: Gartenpirat Kotlin, Compose and native regression checks

on:
  workflow_dispatch:
    inputs:
      emulator:
        description: 'Native Laufzeitprüfungen im isolierten Emulator ausführen'
        type: boolean
        default: true
        required: false
      graphics_only:
        description: 'Nur die unabhängige Grafikprüfung auf frischem synthetischen Appbestand ausführen'
        type: boolean
        default: false
        required: false
      settlement_only:
        description: 'Rechnungen und historische Laborbelege mit SQLite, PDF, ZIP/Restore, Prozessneustart und Compose prüfen'
        type: boolean
        default: false
        required: false
      settlement_ui_only:
        description: 'Nur unabhängige Compose-Abnahme der Rechnungen und historischen Laborbelege auf frischem synthetischen Bestand'
        type: boolean
        default: false
        required: false
      accounting_only:
        description: 'Nur Abrechnung mit synthetischer Datenbank, echter Oberfläche und Prozessneustart prüfen'
        type: boolean
        default: false
        required: false
  pull_request:
    branches: [main]
    paths:
      - '.gitattributes'
      - 'AGENTS.md'
      - 'README.md'
      - 'struktur-neu/README.md'
      - 'struktur-neu/AKTUELLER-STAND.json'
      - 'struktur-neu/privacy_guard.py'
      - 'struktur-neu/privacy_policy.json'
      - 'struktur-neu/docs/**'
      - 'struktur-neu/android/**'
      - 'struktur-neu/tests/**'
      - 'struktur-neu/tools/**'
      - '.github/workflows/qa-apk.yml'

permissions:
  contents: read

# A newer push to the same PR or branch replaces the running check.
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: struktur-neu
        shell: bash
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Check current source and synthetic fixtures
        run: python3 -B tools/check_current.py
      - name: Install Android build packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          python3 - "$SDKMANAGER" <<'PY'
          import subprocess,sys
          subprocess.run([sys.argv[1], '--licenses'], input='y\n'*100, text=True, check=True)
          PY
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'
      - name: Build production sources and native test APK without release signing
        working-directory: struktur-neu/android
        env:
          FOCUSED_UI: ${{ github.event_name == 'workflow_dispatch' && (inputs.accounting_only || inputs.settlement_ui_only) }}
        run: |
          tasks=(:app:assembleRelease :app:assembleReleaseAndroidTest)
          if [ "$FOCUSED_UI" != true ]; then tasks+=(:app:lintRelease); fi
          gradle --no-daemon --no-configuration-cache --build-cache --max-workers=2 "${tasks[@]}"
      - name: Run JVM contract suites
        if: github.event_name != 'workflow_dispatch' || (!inputs.accounting_only && !inputs.settlement_ui_only)
        working-directory: struktur-neu/android
        run: gradle --no-daemon --no-configuration-cache --build-cache --max-workers=2 :app:testReleaseUnitTest
      - name: Keep unsigned packages for the emulator job
        run: |
          set -euo pipefail
          mkdir -p outputs/unsigned
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk outputs/unsigned/
          TEST_APK=$(find android/app/build/outputs/apk/androidTest/release -name '*.apk' -print -quit)
          test -n "$TEST_APK"
          cp "$TEST_APK" outputs/unsigned/app-release-androidTest.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Gartenpirat-unsigned-packages
          path: struktur-neu/outputs/unsigned/
          retention-days: 1
      - name: Preserve lint and JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gartenpirat-reports
          path: |
            struktur-neu/android/app/build/reports/lint-results-release.html
            struktur-neu/android/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  emulator:
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.emulator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: struktur-neu
        shell: bash
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: actions/download-artifact@v4
        with:
          name: Gartenpirat-unsigned-packages
          path: ${{ runner.temp }}/unsigned
      - name: Prepare isolated emulator packages
        run: |
          set -euo pipefail
          # This disposable Kotlin/Android runner never uses the preinstalled .NET SDK.
          # Leave enough real disk headroom for the Google APIs userdata image.
          if [ -d /usr/share/dotnet ]; then sudo rm -rf /usr/share/dotnet; fi
          df -h "$RUNNER_TEMP"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'
          if [ ! -x "$ANDROID_HOME/emulator/emulator" ]; then
            "$SDKMANAGER" 'emulator'
          fi
          "$SDKMANAGER" 'system-images;android-35;google_apis;x86_64'
      - name: Build pinned 158 baseline for an actual APK update
        if: github.event_name != 'workflow_dispatch' || (!inputs.graphics_only && !inputs.settlement_only && !inputs.settlement_ui_only && !inputs.accounting_only)
        run: |
          set -euo pipefail
          # The original one-day APK artifact has expired. Rebuild the exact previously
          # green source without altering it; do not substitute a freshly seeded 159 app.
          baseline_commit=8101f3c395c9770005727bc37fc2f2057fca9130
          git fetch --no-tags --depth=1 origin "$baseline_commit"
          git worktree add --detach "$RUNNER_TEMP/baseline158" "$baseline_commit"
          test "$(git -C "$RUNNER_TEMP/baseline158" rev-parse HEAD)" = "$baseline_commit"
          mkdir -p outputs
          python3 -B "$RUNNER_TEMP/baseline158/struktur-neu/tools/check_release_baseline.py" > outputs/qa-upgrade-baseline-source.json
          python3 - <<'PY'
          import json,pathlib
          value=json.loads(pathlib.Path('outputs/qa-upgrade-baseline-source.json').read_text())
          assert value['version_code']==158 and value['source_dirty'] is False, value
          assert value['git_sha']=='8101f3c395c9770005727bc37fc2f2057fca9130', value
          assert value['source_sha256']=='7442733c07dee2e28fe62ad8b50b34819b90f22e68cedeab59ae1dd4eb9fd640', value
          PY
          # Sequential build, same JDK/SDK/Gradle as the current candidate. No original key.
          gradle -p "$RUNNER_TEMP/baseline158/struktur-neu/android" --no-daemon --no-configuration-cache --build-cache --max-workers=2 :app:assembleRelease
          cp "$RUNNER_TEMP/baseline158/struktur-neu/android/app/build/outputs/apk/release/app-release-unsigned.apk" "$RUNNER_TEMP/baseline158-unsigned.apk"
      - name: Sign disposable emulator test packages only
        run: |
          set -euo pipefail
          # This temporary test key is never used for a user APK and no APK is published.
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/gp-test.jks" -storepass android -keypass android -alias qa -keyalg RSA -validity 2 -dname 'CN=Gartenpirat Synthetic Emulator Only'
          SIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          ALIGN="$ANDROID_HOME/build-tools/37.0.0/zipalign"
          "$ALIGN" -f 4 "$RUNNER_TEMP/unsigned/app-release-unsigned.apk" "$RUNNER_TEMP/gp-app.apk"
          "$ALIGN" -f 4 "$RUNNER_TEMP/unsigned/app-release-androidTest.apk" "$RUNNER_TEMP/gp-test.apk"
          "$SIGNER" sign --ks "$RUNNER_TEMP/gp-test.jks" --ks-pass pass:android --key-pass pass:android "$RUNNER_TEMP/gp-app.apk"
          "$SIGNER" sign --ks "$RUNNER_TEMP/gp-test.jks" --ks-pass pass:android --key-pass pass:android "$RUNNER_TEMP/gp-test.apk"
          if [ -f "$RUNNER_TEMP/baseline158-unsigned.apk" ]; then
            "$ALIGN" -f 4 "$RUNNER_TEMP/baseline158-unsigned.apk" "$RUNNER_TEMP/gp-baseline158.apk"
            "$SIGNER" sign --ks "$RUNNER_TEMP/gp-test.jks" --ks-pass pass:android --key-pass pass:android "$RUNNER_TEMP/gp-baseline158.apk"
            "$SIGNER" verify --verbose --print-certs "$RUNNER_TEMP/gp-baseline158.apk" > outputs/qa-upgrade-baseline-certificate.txt
            "$SIGNER" verify --verbose --print-certs "$RUNNER_TEMP/gp-app.apk" > outputs/qa-upgrade-candidate-certificate.txt
            python3 - <<'PY'
          import pathlib,sys
          sys.path.insert(0,'tools')
          from sign_original_apk import single_signer_certificate
          certificates=[]
          for kind in ('baseline','candidate'):
              value=pathlib.Path(f'outputs/qa-upgrade-{kind}-certificate.txt').read_text()
              certificates.append(single_signer_certificate(value))
          assert certificates[0]==certificates[1], 'Synthetic update must retain the same QA signer'
          PY
          fi
          mkdir -p outputs
          (cd "$RUNNER_TEMP" && sha256sum gp-app.apk gp-test.apk) | tee outputs/qa-test-package-identity.txt
      - name: Run native SQLite, Compose, document picker, provider and new-process checks
        timeout-minutes: 85
        env:
          GRAPHICS_ONLY: ${{ inputs.graphics_only }}
          ACCOUNTING_ONLY: ${{ inputs.accounting_only }}
          SETTLEMENT_ONLY: ${{ inputs.settlement_only }}
          SETTLEMENT_UI_ONLY: ${{ inputs.settlement_ui_only }}
          CANDIDATE_GIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm
          export ANDROID_USER_HOME="$RUNNER_TEMP/gp-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n Gartenpirat_Backup_QA -p "$ANDROID_AVD_HOME/Gartenpirat_Backup_QA.avd" -k 'system-images;android-35;google_apis;x86_64'
          # The Google APIs image defaults to a 6-GB data partition. Bound the
          # disposable synthetic database/media volume to fit the hosted runner.
          python3 - "$ANDROID_AVD_HOME/Gartenpirat_Backup_QA.avd/config.ini" <<'PYAVD'
          import pathlib,sys
          path=pathlib.Path(sys.argv[1])
          settings={'disk.dataPartition.size':'3072M','hw.camera.back':'emulated','hw.camera.front':'emulated'}
          lines=[line for line in path.read_text().splitlines() if line.partition('=')[0].strip() not in settings]
          path.write_text('\n'.join(lines+[key+'='+value for key,value in settings.items()])+'\n')
          print('AVD data partition: 3072M; one normalized setting')
          PYAVD
          df -h "$ANDROID_AVD_HOME"
          test -f "$ANDROID_AVD_HOME/Gartenpirat_Backup_QA.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          "$ANDROID_HOME/emulator/emulator" -avd Gartenpirat_Backup_QA -port 5580 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          ADB="$ANDROID_HOME/platform-tools/adb"
          timeout 180 "$ADB" -s emulator-5580 wait-for-device
          for attempt in $(seq 1 120); do
            if [ "$("$ADB" -s emulator-5580 shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$("$ADB" -s emulator-5580 shell getprop ro.kernel.qemu | tr -d '\r')" = 1
          test "$("$ADB" -s emulator-5580 shell getprop sys.boot_completed | tr -d '\r')" = 1
          mkdir -p outputs
          upgrade_failures=0
          if [ -f "$RUNNER_TEMP/gp-baseline158.apk" ]; then
            # Run normally: an if/|| function call would disable the child's errexit.
            set +e
            (
              set -euo pipefail
              "$ADB" -s emulator-5580 install "$RUNNER_TEMP/gp-baseline158.apk"
              "$ADB" -s emulator-5580 install "$RUNNER_TEMP/gp-test.apk"
              timeout 180 "$ADB" -s emulator-5580 shell am instrument -w -e suite upgrade_158_seed \
                -e expected_source 7442733c07dee2e28fe62ad8b50b34819b90f22e68cedeab59ae1dd4eb9fd640 \
                -e expected_git 8101f3c395c9770005727bc37fc2f2057fca9130 \
                at.hausgarten.service.test/at.hausgarten.service.PixelMcpInstrumentation | tee outputs/upgrade_158_seed.txt
              python3 - <<'PY'
          import json,pathlib
          text=pathlib.Path('outputs/upgrade_158_seed.txt').read_text()
          assert 'INSTRUMENTATION_CODE: -1' in text and 'INSTRUMENTATION_RESULT: failure=' not in text, text
          result=json.loads(next(line.split('=',1)[1] for line in text.splitlines() if line.startswith('INSTRUMENTATION_RESULT: result=')))
          assert result['suite']=='upgrade_158_seed' and result['checks']>0 and result['installed_version_code']==158, result
          assert result['synthetic_only'] is True and result['productive_data_read'] is False, result
          PY
              "$ADB" -s emulator-5580 shell am force-stop at.hausgarten.service
              "$ADB" -s emulator-5580 shell am force-stop at.hausgarten.service.test
              # No pm clear, uninstall, restore or fixture reseeding between these APKs.
              "$ADB" -s emulator-5580 install -r "$RUNNER_TEMP/gp-app.apk"
              candidate_source=$(python3 -B tools/check_release_baseline.py | python3 -c 'import json,sys; print(json.load(sys.stdin)["source_sha256"])')
              timeout 180 "$ADB" -s emulator-5580 shell am instrument -w -e suite upgrade_158_verify \
                -e expected_source "$candidate_source" -e expected_git "$CANDIDATE_GIT" \
                at.hausgarten.service.test/at.hausgarten.service.PixelMcpInstrumentation | tee outputs/upgrade_158_verify.txt
              python3 - <<'PY'
          import json,pathlib
          text=pathlib.Path('outputs/upgrade_158_verify.txt').read_text()
          assert 'INSTRUMENTATION_CODE: -1' in text and 'INSTRUMENTATION_RESULT: failure=' not in text, text
          result=json.loads(next(line.split('=',1)[1] for line in text.splitlines() if line.startswith('INSTRUMENTATION_RESULT: result=')))
          assert result['suite']=='upgrade_158_verify' and result['checks']>0 and result['installed_version_code']==159, result
          for field in ('synthetic_only','in_place_update','data_preserved','running_session_preserved','drafts_preserved','original_photo_bytes_preserved'):
              assert result[field] is True, result
          assert result['productive_data_read'] is False, result
          PY
            )
            upgrade_status=$?
            set -e
            if [ "$upgrade_status" != 0 ]; then
              upgrade_failures=$((upgrade_failures+1))
              echo "::error::158 to 159 upgrade proof failed (status $upgrade_status); independent suites will still run."
            fi
          elif [ "$GRAPHICS_ONLY" != true ] && [ "$ACCOUNTING_ONLY" != true ] && [ "$SETTLEMENT_ONLY" != true ] && [ "$SETTLEMENT_UI_ONLY" != true ]; then
            upgrade_failures=$((upgrade_failures+1))
            echo "::error::Full run is missing the required signed 158 baseline."
          fi
          # Even a failed seed/verify may leave 158 installed or a running fixture.
          # Install the actual candidate before clearing this disposable app; never clear
          # between successful seeding, install -r and verification of the real update.
          "$ADB" -s emulator-5580 shell am force-stop at.hausgarten.service
          "$ADB" -s emulator-5580 shell am force-stop at.hausgarten.service.test
          "$ADB" -s emulator-5580 install -r "$RUNNER_TEMP/gp-app.apk"
          "$ADB" -s emulator-5580 install -r "$RUNNER_TEMP/gp-test.apk"
          test "$("$ADB" -s emulator-5580 shell pm clear at.hausgarten.service | tr -d '\r')" = Success
          native_suite_failures=0
          if [ "$SETTLEMENT_UI_ONLY" = true ]; then
            suites=(native_settlement_ui)
          elif [ "$SETTLEMENT_ONLY" = true ]; then
            suites=(native_settlement native_settlement_reopen native_settlement_ui)
          elif [ "$ACCOUNTING_ONLY" = true ]; then
            suites=(native_accounting native_accounting_reopen)
          elif [ "$GRAPHICS_ONLY" = true ]; then
            suites=(native_graphics)
          else
            suites=(local_backup local_backup_reopen native_data document_provider document_provider_reopen document_provider_media document_provider_media_reopen native_compose native_settlement native_settlement_reopen native_settlement_ui native_accounting native_accounting_reopen native_graphics)
          fi
          # Every UI journey gets a new process and a completely empty app sandbox.
          compose_journeys=(today_hub customer native_pickers pending_result_read_only usability work_photo_retention accessories timer today_older_work_commit notification customer_context office_opening search_keyboard back_gesture domain_search grouped_search list_actions planning_board property_timeline background_feedback list_viewports filter_keyboard surfaces large_text storage_settings camera_capture)
          graphics_journeys=(graphics_today graphics_work graphics_navigation graphics_accessories graphics_timer graphics_large_text)
          expanded_suites=()
          for suite in "${suites[@]}"; do
            if [ "$suite" = native_compose ]; then
              for journey in "${compose_journeys[@]}"; do expanded_suites+=("native_compose.$journey"); done
            elif [ "$suite" = native_graphics ]; then
              for journey in "${graphics_journeys[@]}"; do expanded_suites+=("native_graphics.$journey"); done
            else expanded_suites+=("$suite"); fi
          done
          for entry in "${expanded_suites[@]}"; do
            suite="${entry%%.*}"
            journey=""
            instrument_args=()
            if [[ "$entry" == *.* ]]; then
              journey="${entry#*.}"
            fi
            # Reopen suites retain only their own preceding synthetic fixture.
            if [[ "$entry" == *.* ]] || [[ "$suite" == document_provider_media || "$suite" == native_settlement || "$suite" == native_settlement_ui || "$suite" == native_accounting ]]; then
              test "$("$ADB" -s emulator-5580 shell getprop ro.build.version.sdk | tr -d '\r')" = 35
              test "$("$ADB" -s emulator-5580 shell getprop ro.kernel.qemu | tr -d '\r')" = 1
              test "$("$ADB" -s emulator-5580 shell pm clear at.hausgarten.service | tr -d '\r')" = Success
            fi
            if [ -n "$journey" ]; then instrument_args=(-e journey "$journey"); fi
            "$ADB" -s emulator-5580 shell am force-stop at.hausgarten.service
            "$ADB" -s emulator-5580 shell am force-stop at.hausgarten.service.test
            # The running-work notice asks once for this permission; a system dialog would cover the UI under test.
            "$ADB" -s emulator-5580 shell pm grant at.hausgarten.service android.permission.POST_NOTIFICATIONS || true
            "$ADB" -s emulator-5580 logcat -c
            instrumentation_status=0
            suite_timeout=360
            if [ "$suite" = native_accounting ] || [ "$suite" = native_settlement ] || [ "$suite" = native_settlement_ui ]; then suite_timeout=900; fi
            if [ "$suite" = native_compose ] || [ "$suite" = native_graphics ]; then suite_timeout=2100; fi
            timeout "$suite_timeout" "$ADB" -s emulator-5580 shell am instrument -w -e suite "$suite" "${instrument_args[@]}" at.hausgarten.service.test/at.hausgarten.service.PixelMcpInstrumentation 2>&1 | tee "outputs/$entry.txt" || instrumentation_status=$?
            timeout 15 "$ADB" -s emulator-5580 logcat -d -t 1500 > "outputs/$entry-logcat.txt" 2>&1 || true
            # Collect only screenshots actually produced by this fresh synthetic run.
            while IFS= read -r image; do
              [ -n "$image" ] || continue
              "$ADB" -s emulator-5580 pull "$image" "outputs/${image##*/}"
            done < <("$ADB" -s emulator-5580 shell find /sdcard/Android/data/at.hausgarten.service/files -maxdepth 1 -name 'qa-native-*.png' 2>/dev/null | tr -d '\r')
            if [ "$instrumentation_status" != 0 ]; then
              native_suite_failures=$((native_suite_failures+1))
              continue
            fi
            if python3 - "$suite" "$entry" "$journey" <<'PY'
          import json,pathlib,sys
          text=pathlib.Path('outputs/'+sys.argv[2]+'.txt').read_text()
          assert 'INSTRUMENTATION_CODE: -1' in text, text
          assert 'INSTRUMENTATION_FAILED' not in text and 'INSTRUMENTATION_RESULT: failure=' not in text, text
          result=json.loads(next(line.split('=',1)[1] for line in text.splitlines() if line.startswith('INSTRUMENTATION_RESULT: result=')))
          assert result['suite']==sys.argv[1] and result['checks']>0, result
          assert result['synthetic_only'] is True and result['productive_data_read'] is False, result
          if sys.argv[1].startswith('local_backup'):
              assert result['native_backup_roundtrip'] is True, result
          elif sys.argv[1]=='native_data':
              assert result['isolated_context_paths'] is True and result['projection_rows']==40000, result
              assert result['real_sqlite_transactions'] is True and result['wal_concurrent_reader'] is True, result
              assert result['local_storage_cleanup'] is True and result['local_delete_without_cloud_guards'] is True, result
              assert result['actual_coroutine_flow'] is True and result['main_thread_disk_violations']==0, result
              mcp=result['eisbaer_mcp']
              for proof in ('empty_appointment_roundtrip','canonical_update_roundtrip','legacy_adoption_roundtrip','search_filters_original_readback','lcr_delete_references','independent_similar_sources','synthetic_only','real_pixel_mcp_adapter'):
                  assert mcp[proof] is True, result
              assert set(mcp['removed_care_tools']) == {'list_care_plans','create_care_plan','update_care_plan','generate_care_visits'}, result
              catalog=result['eisbaer_catalog_mcp']
              assert catalog['catalog_baseline_tools']==155 and catalog['catalog_runtime_tools']==158, result
              for proof in ('exact_runtime_schemas','real_pixel_mcp_adapter','real_rpc_tools_call','durable_business_readback','write_replay_and_stale_conflict','synthetic_only'):
                  assert catalog[proof] is True, result
              planning=result['eisbaer_planning_time_mcp']
              for proof in ('public_adapter_and_real_sqlite','planning_settings_series_and_conflicts','timer_originals_and_replay_readback','synthetic_clock','synthetic_weather_cache_only'):
                  assert planning[proof] is True, result
              assert planning['external_provider_success_claimed'] is False and planning['physical_calendar_weather_verification']=='NOT_RUN', result
              offers=result['eisbaer_offers_mcp']
              for proof in ('fresh_store_readback','catalog_aliases_share_original','invalid_create_atomic','draft_validation_and_finalization','acceptance_creates_exactly_one_order','replay_and_stale_conflicts','marked_delivery_blocked_before_provider','synthetic_only'):
                  assert offers[proof] is True, result
              assert offers['external_messages_sent'] is False and offers['external_provider_readback_tested'] is False, result
              media=result['eisbaer_media_backup_mcp']
              for proof in ('real_pixel_mcp_adapter','original_photo_bytes','write_replay_and_stale_conflict','backup_device_handoff_only','synthetic_only'):
                  assert media[proof] is True, result
              assert media['physical_backup_acceptance'] is False, result
              revier=result['eisbaer_revier_mcp']
              for proof in ('public_adapter_and_real_sqlite','synthetic_only','inquiry_acceptance_inspection_roundtrip','work_alias_and_tour_move_roundtrip','property_update_list_and_permanent_purge','legacy_material_consumption_alias','legacy_originals_preserved'):
                  assert revier[proof] is True, result
              assert revier['calendar_provider_success_claimed'] is False, result
              for proof in (mcp,catalog,planning,offers,media,revier):
                  assert proof['executed_tools'] and len(proof['executed_tools'])==len(set(proof['executed_tools'])), result
              assert result['performance_claim'] is False and result['plans'], result
              for plan in result['plans'].values():
                  assert 'USING INDEX ix_native_read_' in str(plan) and 'TEMP B-TREE' not in str(plan), result
          elif sys.argv[1]=='native_settlement_ui':
              for proof in ('real_main_activity','invoice_completion_and_historical_labor_readback','exact_amounts','filters_and_navigation','font_scale_200_percent','draft_recreation','native_storno_and_offer_acceptance_readback','native_payment_lifecycle_readback','native_offer_share_chooser'):
                  assert result[proof] is True, result
              assert result['physical_pixel_tested'] is False, result
          elif sys.argv[1].startswith('native_settlement'):
              for proof in ('real_sqlite_transactions','isolated_context_paths','native_pdf_verified','native_backup_roundtrip'):
                  assert result[proof] is True, result
              assert result['new_process_readback'] is sys.argv[1].endswith('_reopen'), result
              if not result['new_process_readback']:
                  for proof in ('parallel_reservations','pdf_failure_resume','payment_correction'):
                      assert result[proof] is True, result
              else:
                  assert result['restore_guard'] is True, result
          elif sys.argv[1].startswith('native_accounting'):
              assert result['new_process_readback'] is sys.argv[1].endswith('_reopen'), result
              if not result['new_process_readback']:
                  for proof in ('real_main_activity','lcr_original_reference','historical_original_preservation','viewport_and_large_text'):
                      assert result[proof] is True, result
          elif sys.argv[1]=='native_graphics':
              for proof in ('independent_fresh_fixture','real_main_activity','native_compose_ui'):
                  assert result[proof] is True, result
              assert result['backup_provider_prerequisite'] is False, result
              assert result['physical_pixel_tested'] is False and result['drive_account_tested'] is False, result
              assert result['graphics_cases'] == [sys.argv[3]], result
          elif sys.argv[1]=='native_compose':
              assert result['journey'] == sys.argv[3] and result['independent_fresh_fixture'] is True, result
              assert result['real_main_activity'] is True and result['native_compose_ui'] is True, result
              assert result['drive_account_tested'] is False and result['physical_pixel_tested'] is False, result
          elif sys.argv[1].startswith('document_provider_media'):
              for proof in ('real_external_storage_provider','actual_saf_grant','same_target_atomic_replace'):
                  assert result[proof] is True, result
              assert result['new_process_readback'] is sys.argv[1].endswith('_reopen'), result
              assert result['isolated_restore'] is sys.argv[1].endswith('_reopen'), result
              assert result['restore_cold_start_guard_retained'] is sys.argv[1].endswith('_reopen'), result
              for proof in ('media_restore_ui','restore_confirmation_cancel_no_activation','restore_confirmation_pending_restart'):
                  assert result[proof] is sys.argv[1].endswith('_reopen'), result
              assert result['media_restore_ui_screenshots']==([
                  'qa-native-backup-restore-confirm.png',
                  'qa-native-backup-restore-cancelled.png',
                  'qa-native-backup-restore-pending.png',
              ] if sys.argv[1].endswith('_reopen') else []), result
              assert result['physical_pixel_tested'] is False, result
          else:
              assert sys.argv[1] in ('document_provider','document_provider_reopen'), result
              assert result['real_document_provider_tested'] is True and result['separate_uid_local_provider_tested'] is True, result
              assert result['android_file_picker_tested'] is (not sys.argv[1].endswith('_reopen')), result
              assert result['new_process_readback'] is sys.argv[1].endswith('_reopen') and result['drive_account_tested'] is False, result
              assert result['picker_cancellation_tested'] is (not sys.argv[1].endswith('_reopen')), result
              assert result['picker_activity_recreation_tested'] is (not sys.argv[1].endswith('_reopen')), result
              assert result['provider_process_restart_tested'] is sys.argv[1].endswith('_reopen'), result
          PY
            then
              :
            else
              native_suite_failures=$((native_suite_failures+1))
            fi
          done
          "$ADB" -s emulator-5580 shell am force-stop at.hausgarten.service
          test "$("$ADB" -s emulator-5580 shell pm clear at.hausgarten.service | tr -d '\r')" = Success
          printf 'Upgrade failures: %s; independent suite failures: %s\n' "$upgrade_failures" "$native_suite_failures"
          test "$upgrade_failures" = 0
          test "$native_suite_failures" = 0
      - name: Collect isolated emulator diagnostics
        if: failure()
        run: |
          mkdir -p outputs
          cp "$RUNNER_TEMP/emulator.log" outputs/emulator.txt 2>/dev/null || true
          timeout 15 "$ANDROID_HOME/platform-tools/adb" -s emulator-5580 logcat -d -t 500 > outputs/emulator-logcat.txt 2>&1 || true
          tail -80 outputs/emulator.txt 2>/dev/null || true
          tail -80 outputs/emulator-logcat.txt 2>/dev/null || true
      - name: Preserve synthetic test results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gartenpirat-backup-test-results
          path: |
            struktur-neu/outputs/local_backup*.txt
            struktur-neu/outputs/document_provider*.txt
            struktur-neu/outputs/native_data*.txt
            struktur-neu/outputs/native_compose*.txt
            struktur-neu/outputs/native_graphics*.txt
            struktur-neu/outputs/native_accounting*.txt
            struktur-neu/outputs/native_settlement*.txt
            struktur-neu/outputs/qa-native-*.png
            struktur-neu/outputs/qa-test-package-identity.txt
            struktur-neu/outputs/upgrade_158*.txt
            struktur-neu/outputs/qa-upgrade-*.json
            struktur-neu/outputs/qa-upgrade-*.txt
            struktur-neu/outputs/emulator*.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove disposable test signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/gp-test.jks" "$RUNNER_TEMP/gp-app.apk" "$RUNNER_TEMP/gp-test.apk" "$RUNNER_TEMP/gp-baseline158.apk" "$RUNNER_TEMP/baseline158-unsigned.apk"

  eisbaer:
    name: Eisbär authority and completion
    needs: [build, emulator]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify sole specification and block incomplete completion
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          EMULATOR_RESULT: ${{ needs.emulator.result }}
          FULL_RUN: ${{ github.event_name == 'pull_request' || (inputs.emulator && !inputs.graphics_only && !inputs.settlement_only && !inputs.settlement_ui_only && !inputs.accounting_only) }}
        run: >-
          python3 -B struktur-neu/tools/check_eisbaer.py
          --ci-build-result "$BUILD_RESULT"
          --ci-emulator-result "$EMULATOR_RESULT"
          --ci-full-run "$FULL_RUN"
