name: Gartenpirat QA APK (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses and install Android 17
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_status" -eq 0
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Check source privacy
        run: python3 tests/apk_privacy_guard.py
      - name: Build isolated QA APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Check APK privacy
        run: python3 tests/apk_privacy_guard.py --apk android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload QA APK
        uses: actions/upload-artifact@v4
        with:
          name: Gartenpirat-QA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
