Kontaktadresse separat ansehen. Sie wird nicht automatisch als Einsatzadresse verwendet.</p><p>Beispielhinweis: Zugang vorher abstimmen.</p></details>';
  if(screen==='property'&&!property)return heading('Objekt fehlt','Bitte ein vorhandenes Objekt wählen.')+row('Zur Kundenakte','','profile');
  if(screen==='property')return '<div class="backline"><button data-target="profile">'+svg('back')+'Kundenakte</button><button data-target="edit">Bearbeiten</button></div>'+heading(property.name,'Einsatzobjekt · '+client.name)+'<div class="card"><p class="overline">Bestätigte Einsatzadresse</p><h3 style="margin-top:12px">'+property.address+'</h3><p class="sub">'+client.city+'</p><button class="secondary" style="width:100%;margin-top:17px" data-demo="Navigation würde nur zu dieser gewählten Einsatzadresse geöffnet.">Route öffnen '+svg('arrow')+'</button></div><div class="section-title"><h3>Vor dem Einsatz</h3></div><div class="card"><p>Gartentor seitlich. Zugang vor der Anfahrt abstimmen.</p><p class="sub">Hinweis am Objekt – keine allgemeine Kundenadresse.</p></div>'+row('Pflege & Einsätze','Vorhandene Planung dieses Objekts','planning')+row('Fotos & Verlauf','Dokumentation mit Objektzuordnung','photos')+'<p class="hint" style="margin-top:15px">Bei mehreren Objekten bleibt immer sichtbar, an welchem gearbeitet wird.</p>';
  if(screen==='work')return '<div class="backline"><button data-target="profile">'+svg('back')+'Kundenakte</button></div>'+heading('Arbeit starten',generic?'Kunde und Tätigkeit bewusst wählen.':client.name)+(generic?'<label for="work-customer">Für wen?</label><select id="work-customer"><option value="">Kunde auswählen</option>'+clients.map(c=>'<option value="'+c.id+'">'+c.name+'</option>').join('')+'</select>':'')+'<label for="object-choice">Einsatzobjekt (optional)</label><select id="object-choice"'+(generic?' disabled':'')+'><option value="">Bitte auswählen</option>'+(generic?[]:client.objects).map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join('')+'<option value="general">Allgemeine Arbeit für diesen Kunden</option></select><label for="activity">Tätigkeit</label><input id="activity" type="text" placeholder="Was wird gemacht?"><div class="quick-text"><button data-text="Hecke schneiden">Hecke schneiden</button><button data-text="Rasen mähen">Rasen mähen</button><button data-text="Gartenpflege">Gartenpflege</button></div><p class="hint" style="margin-top:22px">Die Zeit beginnt erst mit dem ausdrücklichen Start. Öffnen und Zurück legen keine Arbeit an.</p>';
  if(screen==='properties')return heading('Objekte','Den Einsatzort bewusst wählen.')+clients.flatMap(c=>c.objects.map(p=>'<button class="row" data-target="property" data-property="'+p.id+'"><span class="copy"><strong>'+p.name+'</strong><small>'+c.name+' · '+p.address+'</small></span><span class="arrow">›</span></button>')).join('');
  if(screen==='edit-property')return heading('Objekt bearbeiten',client.name)+'<label for="property-name">Objektname</label><input id="property-name" type="text" value="'+(property?.name||'')+'"><label for="property-address">Bestätigte Einsatzadresse</label><input id="property-address" type="text" value="'+(property?.address||'')+'"><p class="hint" style="margin-top:20px">Dies ändert die Objektangaben, nicht die Kontakt- oder Rechnungsadresse des Kunden.</p>';
  if(screen==='new'||screen==='edit')return '<div class="backline"><button data-target="'+(screen==='new'?'customers':'profile')+'">'+svg('back')+'Zurück</button></div>'+heading(screen==='new'?'Kunde anlegen':'Kundendaten','Nur das Nötigste zuerst.')+'<label for="customer-name">Name</label><input id="customer-name" type="text"'+(screen==='edit'?' value="'+client.name+'"':' placeholder="Name oder Firma"')+'><details class="profile-facts"><summary>Kontakt & weitere Angaben</summary><label for="customer-phone">Telefon</label><input id="customer-phone" type="text" inputmode="tel"><label for="customer-city">Ort der Kontaktadresse</label><input id="customer-city" type="text"></details><p class="hint" style="margin-top:22px">Bestehender Kunden-Speicherweg. Kein automatischer Datensatz durch Öffnen oder Abbruch.</p>';
  if(screen==='visit')return '<div class="backline"><button data-target="profile">'+svg('back')+'Kundenakte</button></div>'+heading(client.next?.title||'Einsatz',client.name+' · '+(property?.name||'Objekt wählen'))+'<div class="card"><p class="overline">Geplanter Einsatz</p><h3 style="margin-top:12px">Heute · '+(client.next?.time||'Zeit nicht erfasst')+'</h3><p class="sub">'+(property?.address||'Keine bestätigte Einsatzadresse')+'</p></div>'+row('Objekt öffnen','Hinweise und Zugang','property','house')+row('Termin verschieben','Datum und Uhrzeit direkt auswählen','planning-edit','today');
  if(screen==='planning')return heading('Planung','Vorhandene Einsätze öffnen.')+clients.filter(c=>c.next).map(c=>'<button class="row" data-target="visit" data-visit="'+c.next.id+'"><span class="copy"><strong>'+c.next.title+'</strong><small>'+c.name+' · '+c.next.time+' · '+c.next.object+'</small></span><span class="arrow">›</span></button>').join('');
  if(screen==='planning-edit')return '<div class="backline"><button data-target="profile">'+svg('back')+'Zurück</button></div>'+heading('Termin ändern',client.name)+'<label for="date">Datum</label><input id="date" type="date" value="2026-10-27"><div class="inline-fields"><div><label for="from">Von</label><input id="from" type="time" value="'+(client.next?.time.split('–')[0]||'')+'"></div><div><label for="to">Bis</label><input id="to" type="time" value="'+(client.next?.time.split('–')[1]||'')+'"></div></div><p class="hint" style="margin-top:22px">Der vorhandene Kalenderweg bleibt erhalten. Ausstehende Änderungen bleiben als solche erkennbar.</p>';
  const titles={history:'Arbeiten',photos:'Fotos',documents:'Dokumente',offers:'Angebote',inquiries:'Anfragen',invoices:'Rechnungen',payments:'Zahlungen',more:'Mehr'};
  if(screen==='more')return heading('Mehr','Alles Weitere bleibt hier erreichbar.')+(['profile','property','visit'].includes(moreContext)?row(moreContext==='property'?'Objekt bearbeiten':'Kundendaten bearbeiten',moreContext==='property'?(property?.name||'Objekt'):client.name,moreContext==='property'?'edit-property':'edit'):'')+row('Planung','Vorhandene Einsätze und Termine','planning','today')+row('Objekte','Alle Einsatzorte','properties','house')+row('Gerätewartung','Geräte und eigene Wartungen','equipment','office')+row('Sicherung & Einstellungen','Bestehende geschützte Abläufe','settings','shield');
  return '<div class="backline"><button data-target="profile">'+svg('back')+'Zurück</button></div>'+heading(titles[screen]||'Bestehender Bereich',client.name)+'<p class="hint">Hier öffnet sich der vorhandene Fachbereich. Diese Designstudie erzeugt keine Einträge, Fotos, Rechnungen oder Zahlungen.</p>'+row('Zur Kundenübersicht','Kontakt, Einsätze und Objekte','profile');
 }
 function clientRows(term){const rows=clients.filter(c=>[c.name,c.city,c.phone].join(' ').toLocaleLowerCase('de').includes(term.trim().toLocaleLowerCase('de')));return rows.length?rows.map(c=>'<button class="row customer-row" data-client="'+c.id+'"><span class="avatar">'+c.initials+'</span><span class="copy"><strong>'+c.name+'</strong><small>'+c.city+' · '+(c.objects.length?c.objects.length+' '+(c.objects.length===1?'Objekt':'Objekte'):'Noch kein Objekt')+'</small></span><span class="arrow">›</span></button>').join(''):'<p class="empty">Kein passender Kunde.<br>Suche ändern oder bewusst neu anlegen.</p>';}
 const screenRoot=document.getElementById('screens');
 for(const initial of names){const wrap=document.createElement('section');wrap.className='screen-wrap';wrap.innerHTML='<h2>'+labels[initial]+'</h2><article class="phone" data-tone="'+tone+'"><div class="statusbar"><span>09:12</span><span class="indicators">▂▄▆ · 99%</span></div><header class="app-head"><div class="brand">'+svg('leaf')+'Haus & Garten</div><button class="quiet" data-target="more">Mehr ···</button></header><div class="main"></div><p class="mock-status" role="status"></p><div class="dock"></div><div class="nav-slot"></div></article>';screenRoot.append(wrap);const phone=wrap.querySelector('.phone');phone.currentClient=clients[0];phone.currentProperty=clients[0].objects[0];phone.search='';phone.history=[];phone.formDrafts=new Map();phone.root=['profile','property'].includes(initial)?'customers':initial;phone.workGeneric=false;phone.workProperty='';phone.draftKey=()=>phone.screen+':'+(phone.screen==='work'&&phone.workGeneric?'generic':phone.currentClient.id)+(phone.screen==='work'?':'+(phone.workProperty||'none'):'');
  function show(screen,remember=true){if(!phone.discarding&&['work','new','edit','edit-property','planning-edit'].includes(phone.screen)){const values=[...phone.querySelectorAll('.main input,.main select')].map(i=>[i.id,i.value]);if(JSON.stringify(values)!==phone.formInitial)phone.formDrafts.set(phone.draftKey(),values);else phone.formDrafts.delete(phone.draftKey());}if(screen==='more')phone.moreContext=phone.screen;if(remember&&phone.screen)phone.history.push(phone.screen);phone.screen=screen;phone.querySelector('.main').innerHTML=contents(screen,phone.currentClient,phone.currentProperty,phone.workGeneric,phone.moreContext);phone.querySelector('.main').scrollTop=0;phone.querySelector('.mock-status').textContent='';if(['home','customers','office'].includes(screen))phone.root=screen;else if(['profile','property','edit','edit-property'].includes(screen))phone.root='customers';else if(['offers','invoices','inquiries','payments'].includes(screen))phone.root='office';phone.dataset.nested=String(!['home','customers','office'].includes(screen));const parent=phone.history.at(-1)||(['property','work','edit','edit-property','visit','planning'].includes(screen)?'profile':'customers');phone.querySelector('.app-head').innerHTML=phone.dataset.nested==='true'?'<button class="header-back" data-back="1">'+svg('back')+(panelTitles[screen]||'Zurück')+'</button><button class="quiet" data-target="more">Mehr ···</button>':'<div class="brand">'+svg('leaf')+'Haus & Garten</div><button class="quiet" data-target="more">Mehr ···</button>';phone.defaultParent=parent;phone.querySelector('.nav-slot').innerHTML=nav(['more','settings','equipment'].includes(screen)?null:phone.root);const dock=phone.querySelector('.dock');dock.innerHTML=screen==='home'?'<button class="primary" data-target="work">'+svg('plus')+'Arbeit starten</button><button class="secondary" data-target="history">Arbeit nachtragen</button>':screen==='office'?'<button class="primary" data-target="offers">'+svg('plus')+'Angebot vorbereiten</button>':['profile','property','visit'].includes(screen)?'<button class="primary" data-target="work">'+svg('plus')+'Arbeit starten</button>':['work','new','edit','edit-property','planning-edit'].includes(screen)?'<button class="primary" data-demo="Design-Vorschau: Es wurde nichts gespeichert oder gestartet.">'+(screen==='work'?'Jetzt starten':'Speichern')+'</button><button class="secondary" data-target="profile" data-discard="1">Verwerfen</button>':'';dock.hidden=!dock.innerHTML;if(screen==='work'&&phone.workGeneric)dock.querySelector('.primary').disabled=true;if(screen==='work'&&!phone.workGeneric&&phone.workProperty)phone.querySelector('#object-choice').value=phone.workProperty;phone.formInitial=JSON.stringify([...phone.querySelectorAll('.main input,.main select')].map(i=>[i.id,i.value]));for(const [id,value]of phone.formDrafts.get(phone.draftKey())||[]){const field=phone.querySelector('#'+id);if(field){field.value=value;if(id==='work-customer')field.dispatchEvent(new Event('change',{bubbles:true}));}}const input=phone.querySelector('input[type=search]');if(input){input.value=phone.search;phone.querySelector('.customer-results').innerHTML=clientRows(phone.search);}}
  phone.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.back){const target=phone.history.pop()||phone.defaultParent;show(target,false);}else if(b.dataset.client){phone.currentClient=clients.find(c=>c.id===b.dataset.client);phone.currentProperty=phone.currentClient.objects[0];show('profile');}else if(b.dataset.target){if(b.dataset.target==='work'){phone.workGeneric=phone.screen==='home';phone.workProperty=['property','visit'].includes(phone.screen)?phone.currentProperty?.id||'':'';}if(b.dataset.visit){phone.currentClient=clients.find(c=>c.next?.id===b.dataset.visit);phone.currentProperty=phone.currentClient.objects.find(p=>p.id===phone.currentClient.next.property_id);}if(b.dataset.property){phone.currentClient=clients.find(c=>c.objects.some(p=>p.id===b.dataset.property));phone.currentProperty=phone.currentClient.objects.find(p=>p.id===b.dataset.property);}if(b.dataset.discard){phone.formDrafts.delete(phone.draftKey());phone.discarding=true;show(phone.history.pop()||phone.defaultParent,false);phone.discarding=false;return;}if(b.closest('.bottom')){phone.history=b.dataset.target==='home'?[]:['home'];show(b.dataset.target,false);}else show(b.dataset.target);phone.discarding=false;}else if(b.dataset.text){phone.querySelector('#activity').value=b.dataset.text;}else if(b.dataset.demo)phone.querySelector('.mock-status').textContent=b.dataset.demo;});
  phone.addEventListener('change',e=>{if(e.target.id==='work-customer'){const c=clients.find(c=>c.id===e.target.value),field=phone.querySelector('#object-choice');field.disabled=!c;phone.querySelector('.dock .primary').disabled=!c;field.innerHTML='<option value="">Bitte auswählen</option>'+(c?c.objects:[]).map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join('')+'<option value="general">Allgemeine Arbeit für diesen Kunden</option>';}});
  phone.addEventListener('input',e=>{if(e.target.type==='search'){phone.search=e.target.value;phone.querySelector('.customer-results').innerHTML=clientRows(phone.search);}});phone.show=show;show(initial,false);
 }
 window.QADesignPreview=Object.freeze({classification:'SYNTHETIC_TEST',businessWrites:0,clients:clients.map(c=>({id:c.id,test_record:c.test_record,objects:c.objects.length})),tone,setScale(size){document.querySelectorAll('.phone').forEach(p=>{p.style.setProperty('--type-scale',String(size/16));p.classList.toggle('large',size>18);});}});
})();
