plugins {
    id 'com.android.application'
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
    implementation 'com.google.crypto.tink:tink-android:1.24.0'
    constraints {
        implementation('androidx.annotation:annotation:1.8.2') {
            because 'Align the legacy facade with the annotation-jvm version required by Tink; avoid duplicate classes.'
        }
    }
}

// Mandatory for ALL future builds. Prevent accidental productive seed/config packaging.
def offerContractGate = tasks.register('verifyOfferContract', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/sync_offer_contract.py'
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn offerContractGate }
def uiCatalogGate = tasks.register('verifyUiMcpInventory', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/verify_ui_mcp_inventory.py'
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn uiCatalogGate }
def privacyGate = tasks.register('verifyDistributablePrivacy', Exec) {
    workingDir rootProject.projectDir
    commandLine(System.getProperty('os.name').toLowerCase().contains('windows') ? ['py', '-3.11', 'tests/apk_privacy_guard.py', '--prebuild'] : ['python3', 'tests/apk_privacy_guard.py', '--prebuild'])
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn privacyGate }
def syntheticFixtureGate = tasks.register('verifySyntheticFixtures', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/sync_synthetic_fixtures.py'
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn syntheticFixtureGate }
def artifactPrivacyGate = tasks.register('verifyReleaseArtifactPrivacy', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tests/apk_privacy_guard.py', '--apk', 'app/build/outputs/apk/release/app-release-unsigned.apk'
}
tasks.matching { it.name == 'assembleRelease' }.configureEach { finalizedBy artifactPrivacyGate }
def bundlePrivacyGate = tasks.register('verifyReleaseBundlePrivacy', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tests/apk_privacy_guard.py', '--artifact', 'app/build/outputs/bundle/release/app-release.aab'
}
tasks.matching { it.name == 'bundleRelease' }.configureEach { finalizedBy bundlePrivacyGate }

def fingerprintResult = providers.exec {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/check_release_baseline.py'
}.standardOutput.asText.get()
def releaseFingerprint = new groovy.json.JsonSlurper().parseText(fingerprintResult)

android {
    buildFeatures { buildConfig true; resValues true }
    namespace 'at.hausgarten.service'
    compileSdk { version = release(37) }
    buildToolsVersion '37.0.0'
    // Opt-in device instrumentation targets the original signed release, not a second app.
    testBuildType 'release'

    defaultConfig {
        applicationId 'at.hausgarten.service'
        buildConfigField 'String', 'GIT_SHA', '"' + releaseFingerprint.git_sha + '"'
        buildConfigField 'String', 'SOURCE_SHA256', '"' + releaseFingerprint.source_sha256 + '"'
        buildConfigField 'boolean', 'SOURCE_DIRTY', releaseFingerprint.source_dirty.toString()
        minSdk 26
        targetSdk 37
        versionCode releaseFingerprint.version_code
        versionName releaseFingerprint.version_name
        resValue 'string', 'app_name', 'Garten PRODUKTIV'
        buildConfigField 'String', 'APP_CHANNEL', '"PRODUKTIV"'
        buildConfigField 'String', 'DISPLAY_VERSION', '"' + releaseFingerprint.version_name + '"'
        buildConfigField 'int', 'BUILD_NUMBER', releaseFingerprint.version_code.toString()
        testInstrumentationRunner 'at.hausgarten.service.PixelMcpInstrumentation'
    }

    // Preserve the existing Desktop signing selector for sign-local-update.ps1.
    // Debug variants are disabled below; release stays unsigned. Never create a
    // replacement store: the Desktop signer must compare it to the original APK.
    signingConfigs {
        debug {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        fullTest {
            initWith release
            applicationIdSuffix '.fulltest'
            resValue 'string', 'app_name', 'Garten TEST ' + releaseFingerprint.test_build_number
            buildConfigField 'String', 'APP_CHANNEL', '"TEST"'
            buildConfigField 'String', 'DISPLAY_VERSION', '"' + releaseFingerprint.test_version_name + '"'
            buildConfigField 'int', 'BUILD_NUMBER', releaseFingerprint.test_build_number.toString()
            debuggable true
            matchingFallbacks = ['release']
            signingConfig = null
        }
    }
    sourceSets.fullTest.assets.srcDir layout.buildDirectory.dir('generated/fulltest-assets').get().asFile
}

def fullTestAssets = tasks.register('prepareFullFunctionAssets', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/build_fulltest_assets.py', '--output',
        layout.buildDirectory.dir('generated/fulltest-assets').get().asFile.absolutePath
    inputs.files(fileTree('src/main/assets') { include 'mobile.html', '*.js' })
    inputs.file rootProject.file('tools/build_fulltest_assets.py')
    outputs.dir layout.buildDirectory.dir('generated/fulltest-assets')
}
tasks.matching { it.name == 'preFullTestBuild' }.configureEach { dependsOn fullTestAssets }
def fullTestPrivacy = tasks.register('verifyFullTestArtifactPrivacy', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tests/apk_privacy_guard.py', '--apk', 'app/build/outputs/apk/fullTest/app-fullTest-unsigned.apk'
}
tasks.matching { it.name == 'assembleFullTest' }.configureEach { finalizedBy fullTestPrivacy }

// Debug is disabled; release and the explicit fullTest variant remain unsigned.
androidComponents {
    beforeVariants(selector().withBuildType('debug')) { variant -> variant.enable = false }
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.versionCode.set(variant.buildType == 'fullTest' ? releaseFingerprint.test_version_code : releaseFingerprint.version_code)
            output.versionName.set(variant.buildType == 'fullTest' ? releaseFingerprint.test_version_name : releaseFingerprint.version_name)
        }
    }
}

def plantGate = tasks.register('verifySharedPlantAssets', Exec) {
    workingDir rootProject.projectDir
    commandLine(System.getProperty('os.name').toLowerCase().contains('windows') ? ['py', '-3.11', 'tools/sync_plant_assets.py'] : ['python3', 'tools/sync_plant_assets.py'])
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn plantGate }

def maintenanceTextGate = tasks.register('verifyEquipmentMaintenanceTexts', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/sync_equipment_maintenance_texts.py', '--check'
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn maintenanceTextGate }
