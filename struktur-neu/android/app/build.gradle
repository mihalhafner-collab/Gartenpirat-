plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// The synthetic document provider runs in the test APK's own process, outside
// instrumentation's shared target classloader. Keep its Kotlin runtime test-only.
configurations { syntheticDocumentProviderRuntime }

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.08.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'io.coil-kt.coil3:coil-compose:3.3.0'
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
    syntheticDocumentProviderRuntime 'org.jetbrains.kotlin:kotlin-stdlib:2.2.10@jar'
    androidTestImplementation files(configurations.syntheticDocumentProviderRuntime)
    // JVM contract suites (src/test) with real JSON and SQLite instead of Android stubs.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.xerial:sqlite-jdbc:3.46.1.0'
}

// Mandatory for ALL future builds. Prevent accidental productive seed/config packaging.
def offerContractGate = tasks.register('verifyOfferContract', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'python3', 'tools/sync_offer_contract.py'
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn offerContractGate }
def uiCatalogGate = tasks.register('verifyUiMcpInventory', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'python3', 'tools/verify_ui_mcp_inventory.py'
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn uiCatalogGate }
def privacyGate = tasks.register('verifyDistributablePrivacy', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'python3', 'tests/apk_privacy_guard.py', '--prebuild'
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn privacyGate }
def syntheticFixtureGate = tasks.register('verifySyntheticFixtures', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'python3', 'tools/sync_synthetic_fixtures.py'
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn syntheticFixtureGate }
def artifactPrivacyGate = tasks.register('verifyReleaseArtifactPrivacy', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'python3', 'tests/apk_privacy_guard.py', '--apk', 'android/app/build/outputs/apk/release/app-release-unsigned.apk'
}
tasks.matching { it.name == 'assembleRelease' }.configureEach { finalizedBy artifactPrivacyGate }
def bundlePrivacyGate = tasks.register('verifyReleaseBundlePrivacy', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'python3', 'tests/apk_privacy_guard.py', '--artifact', 'android/app/build/outputs/bundle/release/app-release.aab'
}
tasks.matching { it.name == 'bundleRelease' }.configureEach { finalizedBy bundlePrivacyGate }

def fingerprintResult = providers.exec {
    workingDir rootProject.projectDir.parentFile
    commandLine 'python3', 'tools/check_release_baseline.py'
}.standardOutput.asText.get()
def releaseFingerprint = new groovy.json.JsonSlurper().parseText(fingerprintResult)

android {
    buildFeatures { buildConfig true; compose true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'at.hausgarten.service'
    compileSdk { version = release(37) }
    buildToolsVersion '37.0.0'
    // Opt-in device instrumentation targets the original signed release, not a second app.
    testBuildType 'release'

    defaultConfig {
        applicationId 'at.hausgarten.service'
        buildConfigField 'boolean', 'UI_PREVIEW', 'false'
        buildConfigField 'String', 'GIT_SHA', '"' + releaseFingerprint.git_sha + '"'
        buildConfigField 'String', 'SOURCE_SHA256', '"' + releaseFingerprint.source_sha256 + '"'
        buildConfigField 'boolean', 'SOURCE_DIRTY', releaseFingerprint.source_dirty.toString()
        minSdk 26
        targetSdk 37
        versionCode 151
        versionName '1.69.2'
        testInstrumentationRunner 'at.hausgarten.service.PixelMcpInstrumentation'
    }

    lint {
        warningsAsErrors true
        // Domain classes use framework APIs directly and stay free of AndroidX;
        // KTX shortcuts would add a dependency without changing behavior.
        disable 'UseKtx'
        // commit() is intentional where a value must be on disk before continuing.
        disable 'ApplySharedPref'
        // Backups deliberately budget only immediately usable space.
        disable 'UsableSpace'
    }

    testOptions {
        unitTests.all { maxHeapSize = '1g' }
    }

    // Release stays unsigned here; original signing: docs/entwicklung/SIGNIERUNG.md.
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        jvmDefault = org.jetbrains.kotlin.gradle.dsl.JvmDefaultMode.NO_COMPATIBILITY
        allWarningsAsErrors = true
    }
}

// Only the existing operative package is built. No automatically signed parallel APK.
androidComponents {
    beforeVariants(selector().withBuildType('debug')) { variant -> variant.enable = false }
}

def maintenanceTextGate = tasks.register('verifyEquipmentMaintenanceTexts', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'python3', 'tools/sync_equipment_maintenance_texts.py', '--check'
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn maintenanceTextGate }
